name: Build Kargram APK

on:
  workflow_dispatch:
  push:
    branches: [ develop ]

permissions:
  contents: read

env:
  # The runner has 16 GB, so give the daemons more than the laptop-tuned values in
  # gradle.properties. Overrides that file.
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx6g
    -XX:MaxMetaspaceSize=512m
    -Dfile.encoding=UTF-8
    -XX:+UseG1GC
    -Dkotlin.daemon.jvm.options=-Xmx3g

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: build-apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # The runner only has ~14 GB free and this build is large.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Configuration cache is disabled: it does not survive between runners and only
      # costs time to write. ABIs come from `kar.abis` in gradle.properties.
      - name: Assemble
        run: ./gradlew :app:assembleGplayDebug --stacktrace --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kargram-debug
          path: app/build/outputs/apk/gplay/debug/*.apk
          if-no-files-found: error
          retention-days: 14
